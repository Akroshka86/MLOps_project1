repos:
  # Форматирование кода
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  # Проверка стиля кода
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8

  # Сортировка импортов
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
